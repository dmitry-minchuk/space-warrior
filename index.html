<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Space Warrior</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #d8e3ff;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      canvas {
        display: block;
        image-rendering: auto;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #6cf;
        font-size: 22px;
        letter-spacing: 0.25em;
        z-index: 999;
        text-transform: uppercase;
      }
      #loading.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
